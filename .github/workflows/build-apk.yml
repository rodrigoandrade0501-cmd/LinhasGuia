
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip FreeFire_LinhasGuia_Projeto_Celular.zip -d project
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/app/build.gradle")
          s = p.read_text()
          s = s.replace(
              "android {",
              """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }"""
          )
          p.write_text(s)
          PY
          cd project
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: LinhasGuia-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
